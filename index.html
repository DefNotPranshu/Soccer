<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soccer Time?</title>
    <style>
        /* Base Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Prevents scrollbars */
            touch-action: none; /* Prevents zooming/scrolling on mobile tap */
        }

        /* Card Container */
        .card {
            background: white;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            width: 85%;
            max-width: 400px;
            z-index: 10;
        }

        h1 {
            color: #333;
            font-size: 22px;
            margin-bottom: 30px;
        }

        /* Button Container */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            min-height: 60px;
        }

        /* General Button Styles */
        .btn {
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
            -webkit-tap-highlight-color: transparent; /* Removes blue flash on mobile tap */
        }

        /* Yes Button */
        .yes {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: white;
            box-shadow: 0 8px 15px rgba(56, 239, 125, 0.4);
        }

        .yes:active {
            transform: translateY(2px) scale(0.95);
        }

        /* No Button */
        .no {
            background: #ff4b2b;
            color: white;
            box-shadow: 0 8px 15px rgba(255, 75, 43, 0.3);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); 
        }

        /* Success Message */
        #bingMsg {
            display: none;
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            color: #11998e;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Are you gonna play soccer at the field? ⚽</h1>
        <div class="buttons">
            <button id="yesBtn" class="btn yes">Yes</button>
            <button id="noBtn" class="btn no">No</button>
        </div>
        <div id="bingMsg">BING! See you on the pitch! 🎉</div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const bingMsg = document.getElementById('bingMsg');
        
        let isCaptured = false;

        // Function to teleport the button
        function moveNoButton() {
            if (isCaptured) return; // Stop moving if she beat the system
            
            noBtn.style.position = 'fixed';
            
            // Keep it within the screen bounds safely
            const safeX = window.innerWidth - noBtn.offsetWidth - 20;
            const safeY = window.innerHeight - noBtn.offsetHeight - 20;
            
            const x = Math.max(10, Math.random() * safeX);
            const y = Math.max(10, Math.random() * safeY);
            
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        // 1. Move randomly on a timer (makes it hard for mobile users to predict)
        setInterval(moveNoButton, 900);

        // 2. Move away instantly if a finger touches it
        noBtn.addEventListener('touchstart', (e) => {
            // We don't use e.preventDefault() here so the tap CAN register if she's inhumanly fast
            moveNoButton();
        });

        // 3. Move on hover for desktop fallback
        noBtn.addEventListener('mouseover', moveNoButton);

        // THE BING FUNCTION (Winning state)
        function triggerVictory(buttonToLock) {
            bingMsg.style.display = 'block';
            
            buttonToLock.style.transform = 'scale(1.1)';
            buttonToLock.style.boxShadow = '0 0 30px rgba(56, 239, 125, 0.8)';
            
            // Audio ping
            const audio = new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3');
            audio.play().catch(() => console.log("Audio played visually!"));
        }

        // Standard Yes Click
        yesBtn.addEventListener('click', () => {
            triggerVictory(yesBtn);
            noBtn.style.display = 'none'; // Hide the no button
        });

        // IF SHE SOMEHOW CLICKS THE NO BUTTON
        noBtn.addEventListener('click', () => {
            isCaptured = true; // Stops the random timer movement
            
            // Transform the "No" button into a "Yes" button
            noBtn.innerText = 'Yes';
            noBtn.className = 'btn yes'; // Swaps the red for green styling
            
            // Trigger the win using the newly converted button
            triggerVictory(noBtn);
            
            // Hide the original yes button so there's only one big "Yes" on screen
            yesBtn.style.display = 'none';
        });
    </script>

</body>
</html>
