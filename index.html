<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soccer Time?</title>
    <style>
        /* Base Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Prevents scrollbars when the button runs away */
        }

        /* Card Container */
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            z-index: 10;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 30px;
        }

        /* Button Container */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            min-height: 60px; /* Prevents layout shift when No button escapes */
        }

        /* General Button Styles */
        .btn {
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* Yes Button - Very Pressable */
        .yes {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: white;
            box-shadow: 0 8px 15px rgba(56, 239, 125, 0.4);
        }

        .yes:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 20px rgba(56, 239, 125, 0.6);
        }

        .yes:active {
            transform: translateY(1px);
        }

        /* No Button */
        .no {
            background: #ff4b2b;
            color: white;
            box-shadow: 0 8px 15px rgba(255, 75, 43, 0.3);
            /* Transition makes it slide quickly instead of teleporting instantly */
            transition: all 0.15s ease-out; 
        }

        /* Success Message */
        #bingMsg {
            display: none;
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
            color: #11998e;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Are you gonna play soccer at the field? ⚽</h1>
        <div class="buttons">
            <button id="yesBtn" class="btn yes">Yes</button>
            <button id="noBtn" class="btn no">No</button>
        </div>
        <div id="bingMsg">BING! See you on the pitch! 🎉</div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const bingMsg = document.getElementById('bingMsg');

        // Make the "No" button run away on hover
        noBtn.addEventListener('mouseover', () => {
            // Switch to fixed positioning so it can move anywhere on the screen
            noBtn.style.position = 'fixed';
            
            // Calculate random coordinates within the window boundaries
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);
            
            // Apply the new coordinates
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        });

        // Just in case they manage to click it while it's moving
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
        });

        // The "Yes" button interaction
        yesBtn.addEventListener('click', () => {
            // Show the text
            bingMsg.style.display = 'block';
            
            // Make the button look locked in
            yesBtn.style.transform = 'scale(1.1)';
            yesBtn.style.boxShadow = '0 0 30px rgba(56, 239, 125, 0.8)';
            
            // Play a "Bing" sound
            // (Note: Browsers require user interaction before playing audio, which the click provides)
            const audio = new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3');
            audio.play().catch(error => {
                console.log("Audio playback was blocked, but the visual bing worked!");
            });
            
            // Hide the No button entirely since they made the right choice
            noBtn.style.display = 'none';
        });
    </script>

</body>
</html>
